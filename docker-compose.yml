# Operations Assistant: local demonstration stack.
# Everything is published on 127.0.0.1 only. Do not expose these ports to the internet.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # No ports published: only n8n can reach the model, over the internal network.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    # One-off job: downloads the model on first start (about 4.7 GB for qwen2.5:7b).
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy   # wait until the model server answers, or the download fails at once
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    restart: "no"

  n8n:
    image: n8nio/n8n:2.35.7
    depends_on: [ollama]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    # Import and activate the workflow on first start only, so later edits made in the n8n editor are kept.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /home/node/.n8n/.workflow-imported ]; then
          n8n import:workflow --input=/workflows/project-intake.json &&
          n8n publish:workflow --id=projectIntake01 &&
          touch /home/node/.n8n/.workflow-imported
        fi
        exec n8n start
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on: [n8n]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/project-intake
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      APP_CALLBACK_URL: http://app:8000
      PROCESSING_TIMEOUT_S: ${PROCESSING_TIMEOUT_S:-1800}
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  ollama_models:
  n8n_data:
  app_data:
